<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grace Songs | కృపా గీతాలు</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Telugu", sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #5b3cc4;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 18px;
    }

    .search-box {
      max-width: 700px;
      margin: 20px auto;
      padding: 0 15px;
    }

    #search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .songs {
      max-width: 900px;
      margin: auto;
      padding: 10px 15px 40px;
    }

    .song {
      background: white;
      margin: 15px 0;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .song h2 {
      margin-top: 0;
      color: #5b3cc4;
    }

    .lyrics {
      white-space: pre-line;
      line-height: 1.8;
      font-size: 17px;
    }

    .media-link {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 15px;
      background: #5b3cc4;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>Grace Songs</h1>
    <p>కృపా గీతాలు</p>
    <p>Christian Songs Lyrics • క్రైస్తవ గీతాల సాహిత్యం</p>
  </header>

  <div class="search-box">
    <input
      type="text"
      id="search"
      placeholder="Search songs / పాటలను వెతకండి..."
      onkeyup="searchSongs()"
    >
  </div>

  <main class="songs" id="songList">

    <div class="song">
      <h2>Sample Song / నమూనా గీతం</h2>

      <div class="lyrics">
English Lyrics Here

ఇక్కడ తెలుగు పాట సాహిత్యం ఉంచవచ్చు.
      </div>

      <a
        class="media-link"
        href="#"
        target="_blank"
      >
        ▶ Listen / Watch
      </a>
    </div>

  </main>

  <footer>
    © 2026 Grace Songs | కృపా గీతాలు
  </footer>

  <script>
    function searchSongs() {
      const search = document.getElementById("search").value.toLowerCase();
      const songs = document.querySelectorAll(".song");

      songs.forEach(song => {
        const text = song.innerText.toLowerCase();

        if (text.includes(search)) {
          song.style.display = "block";
        } else {
          song.style.display = "none";
        }
      });
    }
  </script>

</body>
</html>
