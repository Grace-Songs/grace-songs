<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="Cms3mjxjBod8uz8wWFv0U0-Kt8oaU61XuJsSsQ7kBUU" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grace Songs | Grace Of Christ Church</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5ff;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #5b21b6, #9333ea);
      color: white;
      text-align: center;
      padding: 45px 20px 35px;
    }

    header h1 {
      margin: 0;
      font-size: 42px;
    }

    header h2 {
      margin: 8px 0;
      font-size: 25px;
    }

    header p {
      margin: 8px 0 20px;
    }

    .search {
      width: 100%;
      max-width: 600px;
      padding: 14px 18px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      outline: none;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .category {
      border: none;
      background: #e9d5ff;
      color: #581c87;
      padding: 10px 16px;
      border-radius: 25px;
      white-space: nowrap;
      cursor: pointer;
    }

    .category.active {
      background: #6d28d9;
      color: white;
    }

    #status {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .songs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .song-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .song-card h3 {
      margin: 0 0 6px;
      color: #5b21b6;
    }

    .song-card .telugu {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .tag {
      display: inline-block;
      background: #f3e8ff;
      color: #6d28d9;
      padding: 5px 9px;
      border-radius: 15px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button.action {
      border: none;
      border-radius: 9px;
      padding: 10px 14px;
      cursor: pointer;
      background: #6d28d9;
      color: white;
    }

    button.media {
      background: #16a34a;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #666;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      max-width: 700px;
      margin: 30px auto;
      background: white;
      border-radius: 18px;
      padding: 25px;
      position: relative;
    }

    .close {
      position: absolute;
      right: 15px;
      top: 10px;
      font-size: 28px;
      cursor: pointer;
      color: #666;
    }

    .lyrics {
      white-space: pre-wrap;
      line-height: 1.7;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 34px;
      }

      header h2 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 Grace Songs</h1>
  <h2>కృపా గీతాలు</h2>
  <p>⛪ Grace Of Christ Church</p>

  <input
    class="search"
    id="search"
    type="search"
    placeholder="Search songs / పాటలు వెతకండి..."
  >
</header>

<div class="container">

  <div class="categories">
    <button class="category active" onclick="setCategory('All', this)">All / అన్నీ</button>
    <button class="category" onclick="setCategory('Telugu', this)">తెలుగు</button>
    <button class="category" onclick="setCategory('English', this)">English</button>
    <button class="category" onclick="setCategory('Worship', this)">Worship</button>
    <button class="category" onclick="setCategory('Praise', this)">Praise</button>
    <button class="category" onclick="setCategory('Christmas', this)">Christmas</button>
    <button class="category" onclick="setCategory('Easter', this)">Easter</button>
  </div>

  <div id="status">Loading songs...</div>

  <div class="songs" id="songs"></div>

</div>

<footer>
  <strong>Grace Songs</strong><br>
  Grace Of Christ Church • కృపా గీతాలు
</footer>

<div class="modal" id="lyricsModal">
  <div class="modal-content">
    <span class="close" onclick="closeLyrics()">×</span>

    <h2 id="modalTitle"></h2>
    <div id="modalTelugu"></div>

    <div class="lyrics" id="modalLyrics"></div>

    <div id="modalMedia"></div>
  </div>
</div>

<script>
  const SUPABASE_URL =
    "https://kmjkuajktgydaduhlmvi.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_c5s5vbjKSzy_crPRu4zcVg_uXAK0GcK";
alert("Supabase script loaded");
  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
alert("Supabase client created");
  let songs = [];
  let selectedCategory = "All";

  async function loadSongs() {
    const status = document.getElementById("status");
status.textContent = "Connecting to database...";
    const { data, error } = await supabaseClient
      .from("songs")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      status.textContent = "ERROR: " + error.message;
      console.error(error);
      return;
    }

    songs = data || [];

    status.style.display = songs.length ? "none" : "block";

    if (!songs.length) {
      status.textContent = "No songs added yet.";
    }

    displaySongs();
  }

  function displaySongs() {
    const container = document.getElementById("songs");
    const searchText =
      document.getElementById("search").value.toLowerCase().trim();

    const filtered = songs.filter(song => {

      const matchesSearch =
        (song.title || "").toLowerCase().includes(searchText) ||
        (song.telugu_title || "").toLowerCase().includes(searchText) ||
        (song.lyrics || "").toLowerCase().includes(searchText);

      let matchesCategory = true;

      if (selectedCategory === "Telugu") {
        matchesCategory =
          song.language === "Telugu" ||
          song.language === "Both";
      }
      else if (selectedCategory === "English") {
        matchesCategory =
          song.language === "English" ||
          song.language === "Both";
      }
      else if (selectedCategory !== "All") {
        matchesCategory = song.category === selectedCategory;
      }

      return matchesSearch && matchesCategory;
    });

    if (!filtered.length) {
      container.innerHTML =
        "<p style='text-align:center;grid-column:1/-1;color:#666;'>No matching songs found.</p>";
      return;
    }

    container.innerHTML = filtered.map(song => {

      const mediaButton = song.media_url
        ? `<button class="action media" onclick="openMedia('${escapeAttribute(song.media_url)}')">
             ▶ Watch / Listen
           </button>`
        : "";

      return `
        <div class="song-card">
          <span class="tag">${escapeHtml(song.category || "Worship")}</span>

          <h3>${escapeHtml(song.title || "")}</h3>

          <div class="telugu">
            ${escapeHtml(song.telugu_title || "")}
          </div>

          <div class="buttons">
            <button class="action" onclick="showLyrics(${song.id})">
              📖 Lyrics
            </button>

            ${mediaButton}
          </div>
        </div>
      `;
    }).join("");
  }

  function setCategory(category, button) {
    selectedCategory = category;

    document.querySelectorAll(".category")
      .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    displaySongs();
  }

  document.getElementById("search")
    .addEventListener("input", displaySongs);

  function showLyrics(id) {
    const song = songs.find(s => s.id === id);

    if (!song) return;

    document.getElementById("modalTitle").textContent =
      song.title || "";

    document.getElementById("modalTelugu").textContent =
      song.telugu_title || "";

    document.getElementById("modalLyrics").textContent =
      song.lyrics || "";

    const media = document.getElementById("modalMedia");

    if (song.media_url) {
      media.innerHTML = `
        <br>
        <button class="action media"
          onclick="openMedia('${escapeAttribute(song.media_url)}')">
          ▶ Watch / Listen
        </button>
      `;
    } else {
      media.innerHTML = "";
    }

    document.getElementById("lyricsModal").style.display = "block";
  }

  function closeLyrics() {
    document.getElementById("lyricsModal").style.display = "none";
  }

  function openMedia(url) {
    window.open(url, "_blank");
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function escapeAttribute(text) {
    return String(text)
      .replaceAll("\\", "\\\\")
      .replaceAll("'", "\\'");
  }

  window.onclick = function(event) {
    const modal = document.getElementById("lyricsModal");

    if (event.target === modal) {
      closeLyrics();
    }
  };
function checkSongLink() {
  const songId = new URLSearchParams(window.location.search).get("song");

  if (!songId) return;

  const id = Number(songId);

  if (!Number.isFinite(id)) return;

  const song = songs.find(s => s.id === id);

  if (song) {
    showLyrics(id);
  }
    
  
</script>

</body>
</html>
