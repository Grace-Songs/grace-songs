<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grace Songs Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f5ff;
      color: #211b35;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .header {
      background: linear-gradient(135deg, #5b35b8, #7b4fd1);
      color: white;
      padding: 28px;
      border-radius: 22px;
      margin-bottom: 22px;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .header p {
      opacity: 0.9;
    }

    .card {
      background: white;
      border: 1px solid #e8e2f4;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 7px 25px rgba(50, 30, 90, 0.06);
    }

    .card h2 {
      margin-bottom: 18px;
      color: #51309f;
      font-size: 21px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin: 15px 0 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd6ec;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #6b43c4;
    }

    .button {
      border: none;
      border-radius: 11px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      margin-top: 18px;
    }

    .save {
      background: #633cc1;
      color: white;
    }

    .clear {
      background: #eee9f8;
      color: #5839a0;
      margin-left: 7px;
    }

    .song-item {
      border: 1px solid #e8e2f4;
      border-radius: 15px;
      padding: 16px;
      margin-top: 12px;
    }

    .song-item h3 {
      margin-bottom: 4px;
    }

    .song-item p {
      color: #777;
      font-size: 13px;
    }

    .song-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .edit {
      background: #eee9f8;
      color: #5839a0;
    }

    .delete {
      background: #fbeaea;
      color: #b43a3a;
    }

    .notice {
      background: #fff8e8;
      border: 1px solid #f1dfae;
      color: #735a20;
      padding: 15px;
      border-radius: 13px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .back {
      display: inline-block;
      color: #633cc1;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 18px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .header,
      .card {
        padding: 18px;
      }

      .button {
        width: 100%;
        margin-left: 0;
      }

      .clear {
        margin-left: 0;
      }

      .song-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <a class="back" href="index.html">
      ← Back to Grace Songs
    </a>

    <div class="header">
      <h1>Grace Songs Admin</h1>
      <p>Grace Of Christ Church • కృపా గీతాలు</p>
    </div>

    <div class="notice">
      ⚠️ This is the first dashboard version.
      Your songs are currently stored only in this browser.
      We will connect the dashboard to permanent online storage in the next step.
    </div>

    <div class="card">

      <h2 id="formTitle">➕ Add New Song</h2>

      <input type="hidden" id="songId">

      <label>Song Title – English</label>
      <input
        type="text"
        id="title"
        placeholder="Example: My Worship Song"
      >

      <label>Song Title – Telugu</label>
      <input
        type="text"
        id="telugu"
        placeholder="ఉదాహరణ: నా ఆరాధన గీతం"
      >

      <label>Language</label>
      <select id="language">
        <option>English + Telugu</option>
        <option>English</option>
        <option>Telugu</option>
      </select>

      <label>Category</label>
      <select id="category">
        <option>Worship</option>
        <option>Praise</option>
        <option>Telugu</option>
        <option>English</option>
        <option>Christmas</option>
        <option>Easter</option>
      </select>

      <label>Lyrics</label>
      <textarea
        id="lyrics"
        placeholder="Paste your song lyrics here..."
      ></textarea>

      <label>Optional YouTube / Audio Link</label>
      <input
        type="url"
        id="media"
        placeholder="https://..."
      >

      <button class="button save" onclick="saveSong()">
        Save Song
      </button>

      <button class="button clear" onclick="clearForm()">
        Clear
      </button>

    </div>


    <div class="card">

      <h2>🎵 Your Songs</h2>

      <div id="songList"></div>

    </div>

  </div>


  <script>

    let songs = JSON.parse(
      localStorage.getItem("graceSongsAdmin")
    ) || [];


    function saveSong() {

      const id = document.getElementById("songId").value;

      const song = {
        id: id ? Number(id) : Date.now(),

        title: document.getElementById("title").value.trim(),

        telugu: document.getElementById("telugu").value.trim(),

        language: document.getElementById("language").value,

        category: document.getElementById("category").value,

        lyrics: document.getElementById("lyrics").value.trim(),

        media: document.getElementById("media").value.trim()
      };


      if (!song.title || !song.lyrics) {

        alert("Please enter the song title and lyrics.");

        return;
      }


      const existingIndex = songs.findIndex(
        item => item.id === song.id
      );


      if (existingIndex >= 0) {

        songs[existingIndex] = song;

      } else {

        songs.push(song);

      }


      localStorage.setItem(
        "graceSongsAdmin",
        JSON.stringify(songs)
      );


      clearForm();

      displaySongs();

      alert("Song saved successfully!");

    }


    function displaySongs() {

      const list = document.getElementById("songList");


      if (songs.length === 0) {

        list.innerHTML = `
          <p style="color:#777;">
            No songs added yet.
          </p>
        `;

        return;
      }


      list.innerHTML = songs.map(song => `

        <div class="song-item">

          <h3>${escapeHTML(song.title)}</h3>

          <p>
            ${escapeHTML(song.telugu || "")}
            • ${escapeHTML(song.category)}
          </p>

          <div class="song-buttons">

            <button
              class="button edit"
              onclick="editSong(${song.id})">
              ✏️ Edit
            </button>

            <button
              class="button delete"
              onclick="deleteSong(${song.id})">
              🗑️ Delete
            </button>

          </div>

        </div>

      `).join("");

    }


    function editSong(id) {

      const song = songs.find(
        item => item.id === id
      );

      if (!song) return;


      document.getElementById("songId").value = song.id;

      document.getElementById("title").value = song.title;

      document.getElementById("telugu").value = song.telugu;

      document.getElementById("language").value = song.language;

      document.getElementById("category").value = song.category;

      document.getElementById("lyrics").value = song.lyrics;

      document.getElementById("media").value = song.media;


      document.getElementById("formTitle").textContent =
        "✏️ Edit Song";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function deleteSong(id) {

      if (!confirm("Delete this song?")) {
        return;
      }


      songs = songs.filter(
        song => song.id !== id
      );


      localStorage.setItem(
        "graceSongsAdmin",
        JSON.stringify(songs)
      );


      displaySongs();

    }


    function clearForm() {

      document.getElementById("songId").value = "";

      document.getElementById("title").value = "";

      document.getElementById("telugu").value = "";

      document.getElementById("language").value =
        "English + Telugu";

      document.getElementById("category").value =
        "Worship";

      document.getElementById("lyrics").value = "";

      document.getElementById("media").value = "";

      document.getElementById("formTitle").textContent =
        "➕ Add New Song";

    }


    function escapeHTML(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    displaySongs();

  </script>

</body>
</html>
