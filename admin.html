<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grace Songs Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ff;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #6d28d9, #9333ea);
      color: white;
      padding: 25px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #6d28d9;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 7px 0 14px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 17px;
      margin: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .primary {
      background: #6d28d9;
      color: white;
    }

    .secondary {
      background: #e9d5ff;
      color: #581c87;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .logout {
      background: white;
      color: #6d28d9;
    }

    .song {
      border: 1px solid #e5e7eb;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .song h3 {
      margin: 0 0 5px;
    }

    .song p {
      margin: 5px 0;
      color: #666;
    }

    #adminArea {
      display: none;
    }

    #message {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 Grace Songs Admin</h1>
  <p>Grace Of Christ Church • కృపా గీతాలు</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div class="card" id="loginArea">
    <h2>Admin Login</h2>

    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Password">

    <button class="primary" onclick="login()">Login</button>

    <p id="loginMessage"></p>
  </div>

  <!-- ADMIN -->
  <div id="adminArea">

    <div class="card">
      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2 id="formTitle">Add New Song</h2>

      <div id="message"></div>

      <input id="title" placeholder="English Title">

      <input id="teluguTitle" placeholder="Telugu Title">

      <select id="language">
        <option value="English">English</option>
        <option value="Telugu">Telugu</option>
        <option value="Both">English + Telugu</option>
      </select>

      <select id="category">
        <option value="Worship">Worship</option>
        <option value="Praise">Praise</option>
        <option value="Christmas">Christmas</option>
        <option value="Easter">Easter</option>
        <option value="Other">Other</option>
      </select>

      <textarea id="lyrics" placeholder="Enter song lyrics"></textarea>

      <input id="mediaUrl" placeholder="YouTube / Audio link (optional)">

      <button class="primary" onclick="saveSong()">Save Song</button>
      <button class="secondary" onclick="clearForm()">Clear</button>
    </div>

    <div class="card">
      <h2>My Songs</h2>
      <div id="songList">Loading songs...</div>
    </div>

  </div>
</div>

<script>
  const SUPABASE_URL = "https://kmjkuajktgydaduhlmvi.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_c5s5vbjKSzy_crPRu4zcVg_uXAK0GcK";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let editingId = null;

  async function checkUser() {
    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
      showAdmin();
      loadSongs();
    } else {
      showLogin();
    }
  }

  function showLogin() {
    document.getElementById("loginArea").style.display = "block";
    document.getElementById("adminArea").style.display = "none";
  }

  function showAdmin() {
    document.getElementById("loginArea").style.display = "none";
    document.getElementById("adminArea").style.display = "block";
  }

  async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const msg = document.getElementById("loginMessage");

    if (!email || !password) {
      msg.textContent = "Please enter email and password.";
      return;
    }

    msg.textContent = "Logging in...";

    const { error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      msg.textContent = error.message;
      return;
    }

    msg.textContent = "";
    showAdmin();
    loadSongs();
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    clearForm();
    showLogin();
  }

  async function loadSongs() {
    const list = document.getElementById("songList");
    list.innerHTML = "Loading songs...";

    const { data, error } = await supabaseClient
      .from("songs")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      list.innerHTML = "Error loading songs: " + error.message;
      return;
    }

    if (!data || data.length === 0) {
      list.innerHTML = "No songs added yet.";
      return;
    }

    list.innerHTML = data.map(song => `
      <div class="song">
        <h3>${escapeHtml(song.title || "")}</h3>
        <p>${escapeHtml(song.telugu_title || "")}</p>
        <p>${escapeHtml(song.language || "")} • ${escapeHtml(song.category || "")}</p>

        <button class="secondary"
          onclick="editSong(${song.id})">
          Edit
        </button>

        <button class="danger"
          onclick="deleteSong(${song.id})">
          Delete
        </button>
      </div>
    `).join("");
  }

  async function saveSong() {
    const title = document.getElementById("title").value.trim();
    const teluguTitle = document.getElementById("teluguTitle").value.trim();
    const language = document.getElementById("language").value;
    const category = document.getElementById("category").value;
    const lyrics = document.getElementById("lyrics").value.trim();
    const mediaUrl = document.getElementById("mediaUrl").value.trim();

    const message = document.getElementById("message");

    if (!title || !lyrics) {
      showMessage("English title and lyrics are required.");
      return;
    }

    const songData = {
      title: title,
      telugu_title: teluguTitle,
      language: language,
      category: category,
      lyrics: lyrics,
      media_url: mediaUrl || null
    };

    let result;

    if (editingId) {
      result = await supabaseClient
        .from("songs")
        .update(songData)
        .eq("id", editingId);
    } else {
      result = await supabaseClient
        .from("songs")
        .insert(songData);
    }

    if (result.error) {
      showMessage("Error: " + result.error.message);
      return;
    }

    showMessage(editingId ? "Song updated successfully!" : "Song saved successfully!");

    clearForm();
    loadSongs();
  }

  async function editSong(id) {
    const { data, error } = await supabaseClient
      .from("songs")
      .select("*")
      .eq("id", id)
      .single();

    if (error) {
      showMessage("Error: " + error.message);
      return;
    }

    editingId = id;

    document.getElementById("formTitle").textContent = "Edit Song";

    document.getElementById("title").value = data.title || "";
    document.getElementById("teluguTitle").value = data.telugu_title || "";
    document.getElementById("language").value = data.language || "English";
    document.getElementById("category").value = data.category || "Worship";
    document.getElementById("lyrics").value = data.lyrics || "";
    document.getElementById("mediaUrl").value = data.media_url || "";

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function deleteSong(id) {
    if (!confirm("Delete this song?")) {
      return;
    }

    const { error } = await supabaseClient
      .from("songs")
      .delete()
      .eq("id", id);

    if (error) {
      showMessage("Error: " + error.message);
      return;
    }

    showMessage("Song deleted.");
    loadSongs();
  }

  function clearForm() {
    editingId = null;

    document.getElementById("formTitle").textContent = "Add New Song";

    document.getElementById("title").value = "";
    document.getElementById("teluguTitle").value = "";
    document.getElementById("language").value = "English";
    document.getElementById("category").value = "Worship";
    document.getElementById("lyrics").value = "";
    document.getElementById("mediaUrl").value = "";
  }

  function showMessage(text) {
    const message = document.getElementById("message");
    message.textContent = text;
    message.style.display = "block";
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  checkUser();
</script>

</body>
</html>
